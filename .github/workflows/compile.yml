name: Compile SRS

on:
  push:
    paths:
      - 'proxy.json'
      - 'direct.json'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download sing-box
        run: |
          LATEST=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          VER=${LATEST#v}
          echo "Latest version: $LATEST"
          wget -qO sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/${LATEST}/sing-box-${VER}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          mv sing-box-${VER}-linux-amd64/sing-box ./sing-box
          chmod +x sing-box

      - name: Compile SRS files
        run: |
          for f in proxy.json direct.json; do
            if [ -f "$f" ]; then
              echo "Compiling $f -> ${f%.json}.srs"
              ./sing-box rule-set compile --output "${f%.json}.srs" "$f"
            fi
          done

      - name: Commit SRS files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add proxy.srs direct.srs
          git diff --cached --quiet && echo "No changes" || (git commit -m "Auto compile SRS [skip ci]" && git push)
